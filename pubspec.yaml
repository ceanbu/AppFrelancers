name: workflex
description: Plataforma de conexión entre empleadores y freelancers para trabajos temporales.
publish_to: 'none'
version: 1.7.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_messaging: ^14.7.20

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Utilities
  intl: 0.20.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.3.0
  dio: ^5.4.3+1

  # HTTP (proxy IBGE)
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
